# A short experiment, started by hand: can Microsoft Defender's real-time protection be
# switched on in a hosted runner? The end-to-end tests are only worth running "with
# Defender on" if it can, and if it then really reacts to a test file.
name: probe-defender

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Before
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AMRunningMode, AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled, IsTamperProtected | Format-List
          Get-MpPreference | Select-Object DisableRealtimeMonitoring, DisableBehaviorMonitoring, DisableIOAVProtection, ExclusionPath, ExclusionProcess, ExclusionExtension | Format-List
          foreach ($key in 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender', 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Advanced Threat Protection') {
            "== $key"
            if (Test-Path $key) { Get-ChildItem $key -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.Name; $_ | Get-ItemProperty | Out-String }; Get-ItemProperty $key | Out-String } else { 'absent' }
          }
      - name: Switch it on
        shell: pwsh
        run: |
          Remove-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Advanced Threat Protection' -Name ForceDefenderPassiveMode -ErrorAction SilentlyContinue
          Remove-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender' -Recurse -Force -ErrorAction SilentlyContinue
          $p = Get-MpPreference
          foreach ($x in @($p.ExclusionPath)) { if ($x) { Remove-MpPreference -ExclusionPath $x -ErrorAction SilentlyContinue } }
          foreach ($x in @($p.ExclusionProcess)) { if ($x) { Remove-MpPreference -ExclusionProcess $x -ErrorAction SilentlyContinue } }
          foreach ($x in @($p.ExclusionExtension)) { if ($x) { Remove-MpPreference -ExclusionExtension $x -ErrorAction SilentlyContinue } }
          Set-MpPreference -DisableRealtimeMonitoring $false -DisableBehaviorMonitoring $false -DisableIOAVProtection $false -DisableScriptScanning $false -DisableArchiveScanning $false -ErrorAction Continue
          for ($i = 0; $i -lt 18; $i++) {
            if ((Get-MpComputerStatus).RealTimeProtectionEnabled) { break }
            Start-Sleep -Seconds 5
          }
          Get-MpComputerStatus | Select-Object AMRunningMode, AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled | Format-List
          Get-MpPreference | Select-Object DisableRealtimeMonitoring, ExclusionPath | Format-List
      - name: Does it react to the standard test file?
        shell: pwsh
        run: |
          # The standard anti-virus test string, put together here so that this file does not contain it.
          $text = [Text.Encoding]::ASCII.GetString([Convert]::FromBase64String('WDVPIVAlQEFQWzRcUFpYNTQoUF4pN0ND' + 'KTd9JEVJQ0FSLVNUQU5EQVJELUFOVElWSVJVUy1URVNULUZJTEUhJEgrSCo='))
          $file = Join-Path $env:RUNNER_TEMP 'standard-test-file.com'
          try { [IO.File]::WriteAllText($file, $text); 'written' } catch { 'writing was blocked: ' + $_.Exception.Message }
          Start-Sleep -Seconds 20
          if (Test-Path $file) { try { $null = [IO.File]::ReadAllText($file); 'the file is still there and readable: real-time protection did not react' } catch { 'the file is there but cannot be read: ' + $_.Exception.Message } } else { 'the file was removed: real-time protection reacted' }
          Get-MpThreatDetection | Select-Object -First 3 | Format-List DetectionID, ProcessName, Resources, InitialDetectionTime
