# Unit tests and a build on every push and pull request.
# Actions are pinned to a commit; the comment gives the release it belongs to.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # go vet plus the unit tests, run as a Windows executable.
      - run: npm test
      - run: npm run build
      - name: The launcher starts the executable
        run: node bin/wslbak.js --version

  # The package also installs on Linux, where it must refuse politely outside WSL.
  launcher-outside-wsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Refuses with exit code 2 and a clear message
        run: |
          set +e
          out="$(node bin/wslbak.js --lang en --version 2>&1)"
          code=$?
          echo "$out"
          [ "$code" = 2 ] && echo "$out" | grep -q "only Windows and WSL are supported"
