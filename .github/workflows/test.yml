# Unit tests and a build on every push and pull request.
# Actions are pinned to a commit; the comment gives the release it belongs to.
name: test

on:
  push:
    branches: [main]
  pull_request:
  # Once a week as well: a vulnerability may be published for code that has not changed.
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # go vet plus the unit tests, run as a Windows executable.
      - run: npm test
      - run: npm run build
      - name: The launcher starts the executable
        run: node bin/wslbak.js --version

  # Formatting, static analysis, known vulnerabilities, and the shell scripts.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . scripts)"
      # The tools are built for this runner; what they look at is the Windows program.
      - name: Install staticcheck and govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: staticcheck
        run: GOOS=windows "$(go env GOPATH)/bin/staticcheck" ./...
      - name: govulncheck
        run: GOOS=windows "$(go env GOPATH)/bin/govulncheck" ./...
      - name: shellcheck
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -x -S warning scripts/*.sh
          shellcheck -s sh -S warning backup.sh probe.sh check.sh caches.sh restorefiles.sh

  # The arm64 executables are cross-compiled on x64 above; here they run on real arm64
  # hardware (Windows 11). Hosted arm64 runners cannot run WSL2 (virtualization is not
  # available in them; this was tried), so the job stops at what works without it.
  arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
      - name: The launcher picks the arm64 executable and it starts
        shell: pwsh
        run: |
          node bin/wslbak.js --version
          node bin/wslbak.js --lang en --help | Select-Object -First 3
          if ((& bin/wslbak-arm64.exe --version) -notmatch '^wslbak \d') { exit 1 }
      - name: The windowless executable starts too
        shell: pwsh
        run: |
          $p = Start-Process -FilePath bin/wslbakw-arm64.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

  # The package also installs on Linux, where it must refuse politely outside WSL.
  launcher-outside-wsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Refuses with exit code 2 and a clear message
        run: |
          set +e
          out="$(node bin/wslbak.js --lang en --version 2>&1)"
          code=$?
          echo "$out"
          [ "$code" = 2 ] && echo "$out" | grep -q "only Windows and WSL are supported"
