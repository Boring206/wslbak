# Publishes a release when a tag like v0.1.0 is pushed:
#   unit tests -> build -> zips and checksums -> GitHub Release -> npm
#
# The npm step uses trusted publishing (no token is stored anywhere). It needs, once:
#   - the package to exist on npm already (the very first publish is done by hand),
#   - on npmjs.com, package Settings -> Trusted Publisher -> GitHub Actions with
#     user Boring206, repository wslbak, workflow file release.yml, and
#   - the repository variable NPM_TRUSTED_PUBLISHER set to "yes" once that is done.
#     Until then the npm job is skipped instead of failing.
# Provenance for the zips and for the npm package only works from a public repository,
# so those steps are skipped while the repository is private.
#
# Started by hand, the workflow is a rehearsal: it builds the same files and then, instead
# of publishing, checks that they can be installed in each of the ways the README offers.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The tag must match the version in package.json
        if: github.event_name == 'push'
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          path: |
            dist/
            bin/*.exe

  # The rehearsal. Nothing here leaves the runner.
  rehearse:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: The checksums match the zips
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          foreach ($line in Get-Content dist/SHA256SUMS) {
            $want, $name = $line -split '\s+', 2
            $got = (Get-FileHash -Algorithm SHA256 (Join-Path dist $name.TrimStart('*'))).Hash.ToLower()
            if ($got -ne $want) { Write-Error "checksum mismatch for $name"; exit 1 }
            "ok  $name"
          }
      - name: "Without Node: unzip and run"
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/wslbak-*-windows-x64.zip).FullName
          Expand-Archive $zip -DestinationPath unzipped
          Get-ChildItem unzipped | Format-Table Name, Length
          $version = & unzipped/wslbak.exe --version
          $version
          if ($version -ne "wslbak $((Get-Content package.json | ConvertFrom-Json).version)") { exit 1 }
          & unzipped/wslbak.exe --lang en --help | Select-Object -First 3
          $w = Start-Process -FilePath unzipped/wslbakw.exe -ArgumentList '--version' -Wait -PassThru
          if ($w.ExitCode -ne 0) { exit 1 }
      - name: "npm: what would be published, and installing it"
        shell: pwsh
        run: |
          npm publish --dry-run --ignore-scripts
          $tgz = npm pack --ignore-scripts --silent | Select-Object -Last 1
          npm install --global --prefix "$PWD\npm-prefix" --no-audit --no-fund $tgz
          $version = & "$PWD\npm-prefix\wslbak.cmd" --version
          $version
          if ($version -notmatch '^wslbak \d') { exit 1 }
      - name: "winget: the manifests are valid"
        shell: pwsh
        continue-on-error: true
        run: |
          winget --version
          winget validate --manifest dist\winget --disable-interactivity
      - name: "scoop: install from the manifest, with the zip taken from this run"
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          $manifest = Get-Content dist\scoop\wslbak.json -Raw | ConvertFrom-Json
          $zip = (Get-ChildItem dist/wslbak-*-windows-x64.zip).FullName
          $manifest.architecture.'64bit'.url = ([Uri]$zip).AbsoluteUri
          $manifest | ConvertTo-Json -Depth 8 | Set-Content local-wslbak.json
          scoop install .\local-wslbak.json
          $version = wslbak --version
          $version
          if ($version -notmatch '^wslbak \d') { exit 1 }
          scoop uninstall local-wslbak

  github-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: Attest where the zips were built
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Pack the package manifests for winget and scoop
        run: cd dist && zip -r package-manifests.zip winget scoop
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS

  npm:
    needs: build
    # Trusted publishing with provenance needs a public repository, and the publisher has
    # to be set up on npmjs.com first (see the top of this file).
    if: ${{ github.event_name == 'push' && !github.event.repository.private && vars.NPM_TRUSTED_PUBLISHER == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: Trusted publishing needs npm 11.5.1 or newer
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      - name: The four executables built by the build job are in place
        run: ls -l bin/wslbak-x64.exe bin/wslbak-arm64.exe bin/wslbakw-x64.exe bin/wslbakw-arm64.exe
      # The executables were built and tested in the build job; --ignore-scripts keeps
      # prepack from trying to build them again here, where there is no Go.
      # A version that is on npm already (published by hand) is left alone.
      - run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "wslbak@$version" version >/dev/null 2>&1; then
            echo "wslbak@$version is on npm already; nothing to publish."
          else
            npm publish --ignore-scripts
          fi
