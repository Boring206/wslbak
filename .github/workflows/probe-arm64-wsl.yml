# A short experiment, started by hand: can WSL2 run on a hosted arm64 Windows runner?
# If it can, the end-to-end tests can run there too; if not, arm64 stays limited to what
# the test workflow already does (unit tests, starting the executables).
name: probe-arm64-wsl

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Install the current WSL and try to start a distro
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmd /c ver
          (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          $msi = gh release view --repo microsoft/WSL --json assets --jq '.assets[].name | select(endswith(".arm64.msi"))'
          "installer: $msi"
          gh release download --repo microsoft/WSL --pattern $msi --dir $env:RUNNER_TEMP
          $install = Start-Process msiexec.exe -ArgumentList '/i', "$env:RUNNER_TEMP\$msi", '/quiet', '/norestart' -Wait -PassThru
          "msiexec exit code: $($install.ExitCode)"
          $env:WSL_UTF8 = '1'
          wsl --version
          "--- status ---"
          wsl --status
          "--- install a distro ---"
          wsl --install Debian --no-launch
          "exit code: $LASTEXITCODE"
          "--- start it ---"
          wsl -d Debian -u root -e sh -c "uname -a; cat /etc/os-release | head -n 2"
          "exit code: $LASTEXITCODE"
