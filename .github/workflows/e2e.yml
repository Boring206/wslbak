# End-to-end tests on Windows runners with WSL2: real backups, test restores and restores
# of a throwaway distro. Started by hand or once a week; it never blocks a release, because
# hosted runners differ from a desktop PC (elevated account, no interactive sign-in), and
# the parts about the scheduled task and the console may not work there.
#
# The matrix covers what a single developer PC cannot: other builds of Windows. Windows
# Server 2022 stands in for Windows 10 (same generation), Server 2025 for Windows 11 24H2.
# Microsoft Defender's real-time protection cannot be tested here: the runner images put
# Defender in passive mode, and it could not be switched back on within a job.
name: e2e

on:
  workflow_dispatch:
    inputs:
      distro:
        description: Distro to test against (a name from wsl --list --online, or alpine)
        default: Debian
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run build
      # wslbak needs the WSL that is distributed through the Store and GitHub (the one that
      # understands wsl --version); older Windows images only have the built-in one.
      - name: Install the current WSL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmd /c ver
          $msi = gh release view --repo microsoft/WSL --json assets --jq '.assets[].name | select(endswith(".x64.msi"))'
          gh release download --repo microsoft/WSL --pattern $msi --dir $env:RUNNER_TEMP
          $install = Start-Process msiexec.exe -ArgumentList '/i', "$env:RUNNER_TEMP\$msi", '/quiet', '/norestart' -Wait -PassThru
          "msiexec exit code: $($install.ExitCode)"
          $env:WSL_UTF8 = '1'
          wsl --version
      # The test script runs inside WSL and starts the Windows executables from there,
      # as a user would. This distro only hosts the script; the tests create their own.
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Debian-13
          wsl-version: 2
          additional-packages: nodejs npm curl python3 xz-utils
      - name: Run the end-to-end tests
        shell: wsl-bash {0}
        env:
          E2E_DISTRO: ${{ inputs.distro || 'Debian' }}
          WSLENV: E2E_DISTRO
        run: |
          node --version
          # The upgrade test builds an older version with the Go that was set up on Windows.
          # (sed reads everything, unlike head: the step runs with pipefail, and a reader
          # that leaves early would fail it.)
          GO_WIN="$(cmd.exe /c where go 2>/dev/null | tr -d '\r' | sed -n '1p' || true)"
          if [ -n "$GO_WIN" ]; then export GO="$(wslpath -u "$GO_WIN")"; fi
          bash scripts/e2e.sh
