ShortDescription: Scheduled, verified backups of a WSL distro without stopping it, and one-line restore.
Description: |-
  wslbak backs up a WSL2 distro on a schedule while the distro keeps running, test-restores
  every backup as a temporary distro, notifies you when something fails, and restores with one
  command. Backups are standard .tar.gz archives that wsl --import accepts.
